<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up or log in · TerpFeed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Agdasima:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">
  <main id="main">
    <div class="container">
      <div class="auth-wrap">
        <h1 id="auth-title" style="font-size:3rem">Create your feed</h1>
        <p class="muted" id="auth-sub">Sign up with your UMD email to follow classes, clubs and teams.</p>

        <div class="tabs" role="tablist" aria-label="Account">
          <button role="tab" id="tab-signup" aria-selected="true" aria-controls="auth-form">Sign up</button>
          <button role="tab" id="tab-login" aria-selected="false" aria-controls="auth-form">Log in</button>
        </div>

        <form id="auth-form" class="card" novalidate>
          <div id="form-status" class="form-status form-status--error" role="alert" hidden></div>

          <div class="field" id="name-field">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" autocomplete="name" aria-describedby="name-error">
            <div class="field__error" id="name-error"></div>
          </div>

          <div class="field">
            <label for="email">UMD email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@terpmail.umd.edu" aria-describedby="email-hint email-error">
            <div class="field__hint" id="email-hint">Must end in @umd.edu or @terpmail.umd.edu</div>
            <div class="field__error" id="email-error"></div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-hint password-error">
            <div class="field__hint" id="password-hint">At least 8 characters, including a number</div>
            <div class="field__error" id="password-error"></div>
          </div>

          <button class="btn btn--primary btn--block" type="submit" id="submit-btn">Sign up</button>
          <p class="field__hint" style="margin-top:14px">Prototype: your account is saved only in this browser. Don't reuse a real password.</p>
        </form>
      </div>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
