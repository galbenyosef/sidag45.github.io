<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get started · TerpFeed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Agdasima:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="onboarding">
  <main id="main">
    <div class="container onboard">
      <p class="eyebrow" id="step-label">Step 1 of 2</p>
      <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>

      <section id="step-interests">
        <h1 style="font-size:3rem">What do you want to follow?</h1>
        <p class="muted">Pick your classes and interests. We'll suggest groups to follow next.</p>
        <div id="interest-groups"></div>
      </section>

      <section id="step-groups" hidden>
        <h1 style="font-size:3rem">Suggested groups</h1>
        <p class="muted">Based on what you picked. Follow as many as you like; you can change this anytime.</p>
        <div id="suggested" class="group-grid"></div>
      </section>

      <div class="onboard__footer">
        <button class="btn btn--ghost" id="back-btn" hidden>Back</button>
        <span class="muted" id="selection-count" aria-live="polite">0 selected</span>
        <button class="btn btn--primary" id="next-btn">Continue</button>
      </div>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script src="js/onboarding.js"></script>
</body>
</html>
